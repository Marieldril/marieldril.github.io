<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marieldril - Page Under Construction</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: block;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
        }
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 600px;
            box-sizing: border-box;
        }
        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #00fff0;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #00fff0;
            letter-spacing: 1px;
        }
        p {
            font-size: 1.2rem;
            color: #aaaaaa;
            line-height: 1.6;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner"></div>
        <h1>Page Under Construction</h1>
        <p>We are currently working on a new version of our website. Please check back soon.</p>
    </div>

</body>
</html>
